<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Restaurants">
<meta name="theme-color" content="#FFFDF2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Restaurant App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#00120b;--s:#0F3D2E;--t:#E3B7A3;--n:#FFFDF2;--card:#F6F2E5;--line:#E7E1CE;--mut:#5E6B65}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--n);color:var(--p);font-family:Montserrat,system-ui,sans-serif}
main{padding:calc(env(safe-area-inset-top) + 18px) 20px calc(130px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
main.in{padding-top:6px}
h1{font-size:28px;line-height:1.1;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;margin:0;font-weight:700}
small,.mut{color:var(--mut);font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
input,select,textarea,button{font:inherit;font-size:16px;color:var(--p)}
input,select,textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--t);margin-top:8px}
button{cursor:pointer;background:none;border:0;padding:0}
label{display:block}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.btn,.save{display:block;width:100%;padding:16px;border-radius:16px;background:var(--p);color:var(--n);font-weight:700;margin-top:14px}
.save{font-size:17px;margin-top:28px}
.out{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;margin-top:12px;border:1.5px solid var(--p);border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.1em;text-align:center}
.del{display:block;width:100%;margin-top:20px;padding:14px;color:#9a3b3b;font-weight:600}
.lnk{color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.08em;padding:8px 0}
.dash{border:1.5px dashed #B9B7A4;border-radius:18px;background:none}
.wide{display:block;width:100%;padding:18px;margin-top:6px;font-weight:600;font-size:14px;text-align:center}
.fh{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center;font-weight:700;margin-bottom:22px}
.rb{width:42px;height:42px;border-radius:50%;background:#FFFDF2e6;display:grid;place-items:center;color:var(--p);box-shadow:0 2px 8px #00120b26}
.fh .rb{background:none;box-shadow:none}
.srch{position:relative}
.srch svg{position:absolute;left:14px;top:50%;margin-top:-10px}
.srch input{padding-left:44px}
.ir{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center}
.ph2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;overflow:hidden;cursor:pointer;font-size:14px;padding:6px}
.ph2 img{width:100%;border-radius:14px;display:block}
.hs{display:flex;gap:12px;overflow-x:auto;margin:14px -20px 0;padding:4px 20px 8px}
.dn{flex:none;width:150px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px}
.dm{flex:none;width:170px;background:var(--card);border-radius:18px;overflow:hidden;text-align:left}
.dp{height:110px;background:var(--line)}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
.dq{padding:10px 12px}
.dq b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dq div{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.dq strong{font-size:18px}
.tot{position:relative;background:var(--card);border-radius:24px;padding:22px;margin-top:22px}
.tot h3{margin:0 0 6px;font-size:18px}
.tot>svg{position:absolute;right:18px;top:16px;color:var(--t)}
.big{text-align:center;font-size:56px;font-weight:300;margin:14px 0 0}
.big small{font-size:14px}
.tk{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.rv{display:flex;justify-content:space-between;margin-top:18px;font-weight:600}
.tile{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;margin:12px 0;border-radius:20px;background:#fff;box-shadow:0 2px 12px #00120b14;cursor:pointer}
.tile b{font-size:17px;display:block;margin-bottom:4px}
.badge{flex:none;min-width:48px;height:48px;padding:0 6px;display:grid;place-items:center;background:var(--p);color:var(--n);font-size:17px;font-weight:700;border-radius:14px}
.badge.big{width:60px;height:60px;border-radius:50%;font-size:20px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row select{padding:10px 8px;font-size:13px}
.sw{position:relative;margin:14px 0}
#sug div,.res{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#sug{position:absolute;left:0;right:0;top:100%;background:#fff;border-radius:0 0 14px 14px;box-shadow:0 8px 20px #00120b26;z-index:5}
.res small{display:block}
.hero{min-height:330px;padding:calc(env(safe-area-inset-top) + 14px) 20px 16px;display:flex;flex-direction:column;justify-content:space-between;background-size:cover;background-position:center}
.top{display:flex;justify-content:space-between}
.hb{max-width:640px;width:100%;margin:0 auto}
.tags{display:flex;gap:8px;margin-bottom:8px}
.tg{background:var(--t);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px}
.tg.t2{background:var(--card);border:1px solid var(--line)}
.nr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rt{text-align:right;flex:none}
.rt small{display:block;margin-top:6px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--card);padding:11px 16px;border-radius:999px;font-size:13px;font-weight:600;margin:8px 12px 0 0}
.nt{background:var(--card);border-radius:16px;padding:14px;font-size:14px;white-space:pre-wrap}
.dc{background:#fff;border-radius:22px;overflow:hidden;margin:18px 0;box-shadow:0 2px 12px #00120b14}
.ph{position:relative;aspect-ratio:4/3;background:var(--card);display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.sc{position:absolute;top:12px;right:12px;background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.cb{padding:14px 16px}
.cb b{display:block;font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:var(--n);border-top:1px solid var(--line);z-index:20}
nav[hidden]{display:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:#8C9791;font-size:11px;font-weight:600;padding:6px}
nav button.on{color:var(--s)}
nav .plus{width:58px;height:58px;border-radius:50%;background:var(--p);color:var(--n);justify-content:center;margin:-30px auto 0;box-shadow:0 0 0 6px var(--n)}
#map{position:fixed;inset:0 0 calc(76px + env(safe-area-inset-bottom)) 0}
#map+.rb{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:900}
.mk .lb{position:absolute;left:0;bottom:30px;transform:translateX(-50%);white-space:nowrap;background:var(--p);color:var(--n);font:600 12px Montserrat,sans-serif;padding:6px 11px;border-radius:999px;box-shadow:0 2px 8px #0005}
.mk .lb b{color:var(--t);margin-left:4px}
.mk .pin{position:absolute;left:-9px;top:-22px;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--s);border:3px solid var(--t);box-shadow:0 1px 4px #0006}
.modal{position:fixed;inset:0;background:var(--n);z-index:50;overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 20px 40px}
</style></head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://rjuvhetcgkwysrsibjzf.supabase.co', SB_KEY='sb_publishable__dA8qEIr3hYTRxGCVz-IoQ_iiesFlFx';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const fd=d=>new Date(d+'T12:00').toLocaleDateString('de-DE');
const fdl=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});
const url=p=>sb.storage.from('dishes').getPublicUrl(p).data.publicUrl;
const P=h=>app.innerHTML='<main>'+h+'</main>';
const I={fork:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 1-3 4-3 7 0 2 1 3 3 3v8"/>',map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',back:'<path d="M15 5l-7 7 7 7"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/>',plus:'<path d="M12 5v14M5 12h14"/>',star:'<path d="m12 3 2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z"/>'};
const ic=(n,s=22)=>`<svg width=${s} height=${s} viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round>${I[n]}</svg>`;
$('#nav').innerHTML=`<button data-t=hist onclick="go('hist')">${ic('fork')}Journal</button><button class=plus onclick="openForm()" aria-label="Neuer Besuch">${ic('plus',28)}</button><button data-t=map onclick="go('map')">${ic('map')}Karte</button>`;
const CATS=['Vorspeise','Hauptgericht','Beilage','Dessert','Getränk','Sonstiges'];
let V=[],tab='home',F={q:'',cu:'',min:0,sort:'new'},M=null,cur,D=[],E={},FOCUS=null,TMP,TI;

async function boot(){const{data:{session}}=await sb.auth.getSession();session?load():loginV()}
async function load(){const{data,error}=await sb.from('visits').select('*,dishes(*)').order('created_at',{ascending:false});if(error)return alert('Fehler: '+error.message);V=data;go('home')}
function loginV(){$('#nav').hidden=true;P(`<h1>Restaurant App</h1><p class=mut>Bitte anmelden</p><div class=lbl>E-Mail</div><input id=em type=email autocomplete=username><div class=lbl>Passwort</div><input id=pw type=password autocomplete=current-password><button class=btn onclick=login()>Anmelden</button>`)}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?alert('Anmeldung fehlgeschlagen'):load()}
function go(t){tab=t;if(M){M.remove();M=null}$('#nav').hidden=false;document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));scrollTo(0,0);({home:homeV,hist:histV,map:mapV})[t]()}

const tile=v=>`<div class=tile onclick="detail('${v.id}')"><div><b>${esc(v.name)}</b><small>${fd(v.visit_date)} · ${esc(v.cuisine||'–')} · ${esc(v.city||'–')}</small></div><span class=badge>${fmt(v.rating)}</span></div>`;

function homeV(){P(`<h1>Zuletzt besucht</h1>${V.slice(0,3).map(tile).join('')||'<p class=mut>Noch keine Besuche. Tippe auf +, um den ersten zu erfassen.</p>'}<button class=lnk onclick="go('hist')">ALLE BESUCHE ANSEHEN</button><br><button class=lnk onclick="sb.auth.signOut().then(loginV)">ABMELDEN</button>`)}

function histV(){
 const cus=[...new Set(V.map(v=>v.cuisine).filter(Boolean))].sort();
 P(`<button class=lnk onclick="go('home')">‹ START</button><h1>Journal</h1>
 <div class=sw><input id=q placeholder="Restaurant suchen" autocomplete=off value="${esc(F.q)}"><div id=sug></div></div>
 <div class=row><select id=cu><option value="">Alle Küchen</option>${cus.map(c=>`<option ${c==F.cu?'selected':''}>${esc(c)}</option>`).join('')}</select>
 <select id=mn>${[0,5,6,7,8,9].map(n=>`<option value=${n} ${n==F.min?'selected':''}>${n?'ab '+n:'Alle Punkte'}</option>`).join('')}</select>
 <select id=so><option value=new ${F.sort=='new'?'selected':''}>Neueste</option><option value=az ${F.sort=='az'?'selected':''}>A–Z</option></select></div><div id=list></div>`);
 $('#q').oninput=e=>{F.q=e.target.value;hl()};$('#cu').onchange=e=>{F.cu=e.target.value;hl()};$('#mn').onchange=e=>{F.min=+e.target.value;hl()};$('#so').onchange=e=>{F.sort=e.target.value;hl()};hl()}
function hl(){
 const q=F.q.trim().toLowerCase();
 const a=V.filter(v=>(!q||v.name.toLowerCase().includes(q))&&(!F.cu||v.cuisine==F.cu)&&v.rating>=F.min);
 a.sort(F.sort=='az'?(x,y)=>x.name.localeCompare(y.name,'de'):(x,y)=>y.created_at.localeCompare(x.created_at));
 $('#list').innerHTML=a.map(tile).join('')||'<p class=mut>Keine Treffer.</p>';
 const m=q?[...new Set(V.filter(v=>v.name.toLowerCase().includes(q)&&v.name.toLowerCase()!=q).map(v=>v.name))].slice(0,5):[];
 $('#sug').innerHTML=m.map(n=>`<div onclick="F.q=this.textContent;$('#q').value=F.q;hl()">${esc(n)}</div>`).join('')}

function detail(id){
 const v=cur=V.find(x=>x.id==id);$('#nav').hidden=false;if(M){M.remove();M=null}scrollTo(0,0);
 const ds=[...v.dishes].sort((a,b)=>a.position-b.position);
 const bg=v.photo?`linear-gradient(180deg,#00120b55,#fffdf200 45%,#FFFDF2),url(${url(v.photo)})`:'linear-gradient(180deg,#0F3D2E,#FFFDF2)';
 app.innerHTML=`<div class=hero style="background-image:${bg}"><div class=top><button class=rb onclick="go(tab)">${ic('back')}</button><button class=rb onclick="openForm(cur)" aria-label="Bearbeiten">${ic('edit')}</button></div>
 <div class=hb><div class=tags>${v.cuisine?`<span class=tg>${esc(v.cuisine)}</span>`:''}${v.city?`<span class="tg t2">${esc(v.city)}</span>`:''}</div>
 <div class=nr><h1>${esc(v.name)}</h1><div class=rt><span class="badge big">${fmt(v.rating)}</span><small>Basierend auf ${ds.length} Gericht${ds.length==1?'':'en'}</small></div></div></div></div>
 <main class=in>${v.address?`<p class=ir>${ic('pin',18)}${esc(v.address)}</p>`:''}
 <p class=ir>${ic('cal',18)}Besuch: ${fdl(v.visit_date)}</p>
 ${v.lat!=null?`<button class=chip onclick="FOCUS=cur;go('map')">${ic('map',16)}Auf Karte anzeigen</button><a class=mut href="https://www.google.com/maps/search/?api=1&query=${v.lat},${v.lng}" target=_blank>In Google Maps öffnen</a>`:''}
 ${v.notes?`<p class=nt>${esc(v.notes)}</p>`:''}
 <hr><h2>Gegessene Gerichte</h2>
 ${ds.map(d=>`<div class=dc><div class=ph>${d.photo?`<img src="${url(d.photo)}">`:'<span class=mut>Kein Foto</span>'}<span class=sc>${fmt(d.rating)}</span></div><div class=cb><b>${esc(d.name)}</b><small>${esc(d.category||'')}</small></div></div>`).join('')}
 <button class="dash wide" onclick="openForm(cur,1)">+ Weiteres Gericht hinzufügen</button></main>`}

function mapV(){
 app.innerHTML=`<div id=map></div><button class=rb onclick="go('home')" aria-label="Start">${ic('back')}</button>`;
 M=L.map('map',{zoomControl:false});
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(M);
 const pts=V.filter(v=>v.lat!=null);
 pts.forEach(v=>L.marker([v.lat,v.lng],{icon:L.divIcon({className:'mk',html:`<div class=lb>${esc(v.name)}<b>${fmt(v.rating)}</b></div><div class=pin></div>`,iconSize:[0,0]})}).addTo(M).on('click',()=>detail(v.id)));
 if(FOCUS&&FOCUS.lat!=null){M.setView([FOCUS.lat,FOCUS.lng],16);FOCUS=null;return}
 M.setView(pts.length?[pts[0].lat,pts[0].lng]:[48.2082,16.3738],12);
 navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{if(!M)return;const c=[p.coords.latitude,p.coords.longitude];M.setView(c,13);L.circleMarker(c,{radius:8,color:'#0F3D2E',weight:3,fillColor:'#fff',fillOpacity:1}).addTo(M)})}

// ---------- Formular ----------
function openForm(v,add){
 const t=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
 E=v?{...v}:{name:'',visit_date:t,cuisine:'',city:'',address:'',notes:'',photo:null,lat:null,lng:null,rating:5};
 D=v?[...v.dishes].sort((a,b)=>a.position-b.position).map(d=>({...d})):[];
 const a=D.length?D.reduce((s,d)=>s+d.rating,0)/D.length:0;
 E.auto=!v||Math.abs(E.rating-a)<.06;
 $('#nav').hidden=true;if(M){M.remove();M=null}fv(0);if(add)dishEd(-1)}
function av(){const a=D.filter(d=>d.name.trim()||d.photo||d.blob);if(E.auto&&a.length)E.rating=Math.round(a.reduce((s,d)=>s+d.rating,0)/a.length*10)/10}
function fv(y){
 const cus=[...new Set(V.map(v=>v.cuisine).filter(Boolean))];
 const hp=E.prev||(E.photo&&url(E.photo));
 P(`<div class=fh><button class=rb onclick="go(tab)" aria-label="Schließen">${ic('x')}</button><span>${E.id?'Besuch bearbeiten':'Neuer Besuch'}</span><i></i></div>
 <h2>1. Restaurant</h2>
 <div class=lbl></div><div class=srch>${ic('search',20)}<input placeholder="Name oder Ort suchen…" value="${esc(E.name)}" oninput="E.name=this.value"></div>
 <button class=out onclick=pick()>${ic('map',18)}AUF KARTE WÄHLEN</button>
 ${E.address?`<p class=ir>${ic('pin',16)}${esc(E.address)}</p>`:''}
 <hr><h2>2. Details</h2>
 <div class=lbl>Datum</div><input type=date value="${E.visit_date}" oninput="E.visit_date=this.value">
 <div class=lbl>Küche</div><input list=cl value="${esc(E.cuisine)}" placeholder="z. B. Japanisch" oninput="E.cuisine=this.value"><datalist id=cl>${cus.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class=lbl>Notizen zum Abend</div><textarea rows=3 placeholder="Besonderer Anlass, Stimmung, Service…" oninput="E.notes=this.value">${esc(E.notes)}</textarea>
 <div class=lbl>Restaurant Foto</div>
 <label class="dash ph2">${hp?`<img src="${hp}">`:`${ic('cam',30)}<span>Foto hinzufügen</span>`}<input type=file accept="image/*" hidden onchange="hpic(this)"></label>
 <hr><div class=hd><h2>3. Gerichte</h2><button class=lnk onclick="dishEd(-1)">+ GERICHT</button></div>
 <div class=hs><button class="dash dn" onclick="dishEd(-1)">${ic('plus',24)}<span>Neues Gericht eintragen</span></button>${D.map((d,i)=>`<button class=dm onclick="dishEd(${i})"><div class=dp>${d.prev||d.photo?`<img src="${d.prev||url(d.photo)}">`:''}</div><div class=dq><b>${esc(d.name)}</b><div><small>${esc(d.category||'')}</small><strong>${fmt(d.rating)}</strong></div></div></button>`).join('')}</div>
 <div class=tot>${ic('star',44)}<h3>Gesamtwertung</h3><p class=mut style="margin:0;max-width:85%">Wird aus dem Durchschnitt deiner gegessenen Gerichte berechnet. Mit dem Regler kannst du den Wert anpassen.</p>
 <div class=big><span id=ro>${fmt(E.rating)}</span><small> /10</small></div>
 <input type=range min=1 max=10 step=.5 value=${E.rating} oninput="E.auto=false;E.rating=+this.value;$('#ro').textContent=fmt(this.value)">
 <div class=tk><span>1,0</span><span>5,0</span><span>10,0</span></div></div>
 ${E.id?'<button class=del onclick=del()>Eintrag löschen</button>':''}
 <button class=save onclick=save()>Besuch speichern ✓</button>`);
 scrollTo(0,y||0)}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.8)};i.src=URL.createObjectURL(f)})}
async function hpic(el){const f=el.files[0];if(!f)return;E.blob=await shrink(f);E.prev=URL.createObjectURL(E.blob);fv(scrollY)}
function cm(){const m=$('.modal');m&&m.remove()}

function dishEd(i){
 TI=i;TMP=i<0?{name:'',rating:5,category:'Hauptgericht'}:{...D[i]};
 const pv=TMP.prev||(TMP.photo&&url(TMP.photo));
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class=fh><button class=rb onclick="cm()" aria-label="Schließen">${ic('x')}</button><span>${i<0?'Neues Gericht':'Gericht bearbeiten'}</span><i></i></div>
 <div class="dash ph2" id=dpv>${pv?`<img src="${pv}">`:`${ic('cam',30)}<span>Noch kein Foto</span>`}</div>
 <div class=row style="grid-template-columns:1fr 1fr;margin-top:12px"><label class=out>Kamera<input type=file accept="image/*" capture=environment hidden onchange="dpic(this)"></label><label class=out>Galerie<input type=file accept="image/*" hidden onchange="dpic(this)"></label></div>
 <div class=lbl>Name des Gerichts</div><input value="${esc(TMP.name)}" oninput="TMP.name=this.value">
 <div class=lbl>Kategorie</div><select onchange="TMP.category=this.value">${CATS.map(c=>`<option ${c==TMP.category?'selected':''}>${c}</option>`).join('')}</select>
 <div class=rv><span>Bewertung</span><b id=dr>${fmt(TMP.rating)}</b></div>
 <input type=range min=1 max=10 step=.5 value=${TMP.rating} oninput="TMP.rating=+this.value;$('#dr').textContent=fmt(this.value)">
 <button class=save onclick=dishSave()>Übernehmen ✓</button>${i>=0?'<button class=del onclick=dishDel()>Gericht entfernen</button>':''}`;
 document.body.append(m)}
async function dpic(el){const f=el.files[0];if(!f)return;TMP.blob=await shrink(f);TMP.prev=URL.createObjectURL(TMP.blob);$('#dpv').innerHTML=`<img src="${TMP.prev}">`}
function dishSave(){if(!TMP.name.trim())return alert('Bitte einen Namen für das Gericht eingeben.');TI<0?D.push(TMP):D[TI]=TMP;av();cm();fv(scrollY)}
function dishDel(){D.splice(TI,1);av();cm();fv(scrollY)}

function pick(){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class=fh><button class=rb onclick="cm()" aria-label="Schließen">${ic('x')}</button><span>Restaurant suchen</span><i></i></div><input id=ms placeholder="Name und Stadt, z. B. Figlmüller Wien" value="${esc(E.name)}"><button class=btn onclick=ms()>Suchen</button><div id=mr></div>`;
 document.body.append(m);if(E.name.trim())ms()}
async function ms(){
 $('#mr').textContent='Suche läuft …';
 try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=8&accept-language=de&q='+encodeURIComponent($('#ms').value))).json();window.R=r;
 $('#mr').innerHTML=r.map((x,i)=>`<div class=res onclick=use(${i})><b>${esc(x.name||x.display_name.split(',')[0])}</b><small>${esc(x.display_name)}</small></div>`).join('')||'<p class=mut>Nichts gefunden. Versuche Name plus Stadt.</p>'}
 catch(e){$('#mr').textContent='Suche fehlgeschlagen. Bitte Verbindung prüfen.'}}
function use(i){const x=R[i],a=x.address||{},ct=a.city||a.town||a.village||a.municipality||'';
 const ad=[[a.road,a.house_number].filter(Boolean).join(' '),[a.postcode,ct].filter(Boolean).join(' ')].filter(Boolean).join(', ');
 E.name=x.name||E.name||x.display_name.split(',')[0];
 E.city=ct;E.address=ad||x.display_name.split(',').slice(0,3).join(',');E.lat=+x.lat;E.lng=+x.lon;
 cm();fv(0)}

async function save(){
 if(!E.name.trim())return alert('Bitte einen Restaurantnamen eingeben.');
 av();
 const row={name:E.name.trim(),visit_date:E.visit_date,cuisine:(E.cuisine||'').trim()||null,city:E.city||null,address:E.address||null,notes:(E.notes||'').trim()||null,photo:E.photo||null,lat:E.lat,lng:E.lng,rating:E.rating};
 let id=E.id;
 try{
  if(id){const{error}=await sb.from('visits').update(row).eq('id',id);if(error)throw error}
  else{const{data,error}=await sb.from('visits').insert(row).select().single();if(error)throw error;id=data.id}
  const oldV=V.find(v=>v.id==id),old=(oldV?.dishes||[]).map(d=>d.photo).filter(Boolean);
  if(E.blob){const hp=`${id}/h-${crypto.randomUUID()}.jpg`;const{error}=await sb.storage.from('dishes').upload(hp,E.blob,{contentType:'image/jpeg'});if(error)throw error;const u=await sb.from('visits').update({photo:hp}).eq('id',id);if(u.error)throw u.error;if(oldV?.photo)old.push(oldV.photo)}
  const rows=[];
  for(const[i,d]of D.entries()){
   if(!d.name.trim()&&!d.blob&&!d.photo)continue;
   let p=d.photo||null;
   if(d.blob){p=`${id}/${crypto.randomUUID()}.jpg`;const{error}=await sb.storage.from('dishes').upload(p,d.blob,{contentType:'image/jpeg'});if(error)throw error}
   rows.push({visit_id:id,name:d.name.trim()||'Gericht',rating:d.rating,category:d.category||null,photo:p,position:i})}
  await sb.from('dishes').delete().eq('visit_id',id);
  if(rows.length){const{error}=await sb.from('dishes').insert(rows);if(error)throw error}
  const keep=rows.map(r=>r.photo),rm=old.filter(p=>!keep.includes(p));
  if(rm.length)await sb.storage.from('dishes').remove(rm);
  await load()
 }catch(e){alert('Speichern fehlgeschlagen: '+e.message)}}
async function del(){
 if(!confirm('Diesen Eintrag endgültig löschen?'))return;
 const ph=[E.photo,...E.dishes.map(d=>d.photo)].filter(Boolean);
 if(ph.length)await sb.storage.from('dishes').remove(ph);
 const{error}=await sb.from('visits').delete().eq('id',E.id);
 error?alert(error.message):load()}
boot();
</script></body></html>
